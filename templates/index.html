<!DOCTYPE html>
<html>
<head>
    <title>ACEest Fitness</title>
</head>
<body style="background-color:#1a1a1a; color:white;">

<h1>ACEest FUNCTIONAL FITNESS</h1>

<form method="POST">
    <label>Select Program:</label>
    <select name="program">
        {% for p in programs %}
            <option value="{{p}}">{{p}}</option>
        {% endfor %}
    </select>
    <button type="submit">Show Plan</button>
</form>

{% if data %}
    <h2 style="color: {{data.color}};">Workout</h2>
    <pre>{{data.workout}}</pre>

    <h2>Diet</h2>
    <pre>{{data.diet}}</pre>
{% endif %}

</body>
</html>
