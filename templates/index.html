<!DOCTYPE html>
<html>
<head>
    <title>ACEest Fitness v3</title>
    <style>
        body {
            background: #1a1a1a;
            color: white;
            font-family: Arial;
        }
        .container {
            display: flex;
        }
        .left, .right {
            padding: 20px;
        }
        .left {
            width: 30%;
        }
        .right {
            width: 70%;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            background: #333;
            color: white;
            border: none;
        }
        button {
            background: gold;
            padding: 10px;
            border: none;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        td, th {
            border: 1px solid white;
            padding: 8px;
        }
    </style>
</head>

<body>

<h1>ACEest FUNCTIONAL FITNESS SYSTEM v3</h1>

<div class="container">

<!-- LEFT PANEL -->
<div class="left">
<form method="POST">
    <h3>Client Profile</h3>

    Name:
    <input type="text" name="name">

    Age:
    <input type="number" name="age">

    Weight:
    <input type="number" name="weight">

    Program:
    <select name="program">
        {% for p in programs %}
        <option value="{{p}}">{{p}}</option>
        {% endfor %}
    </select>

    Adherence (%):
    <input type="number" name="adherence">

    <button type="submit">Submit</button>
</form>
</div>

<!-- RIGHT PANEL -->
<div class="right">

<h3>Workout Plan</h3>
<pre>{{ workout }}</pre>

<h3>Diet Plan</h3>
<pre>{{ diet }}</pre>

<h3>Calories</h3>
<p>{{ calories }}</p>

<hr>

<h3>Clients</h3>
<table>
<tr>
    <th>Name</th><th>Age</th><th>Weight</th><th>Program</th><th>Adherence</th>
</tr>

{% for c in clients %}
<tr>
    <td>{{c[0]}}</td>
    <td>{{c[1]}}</td>
    <td>{{c[2]}}</td>
    <td>{{c[3]}}</td>
    <td>{{c[4]}}</td>
</tr>
{% endfor %}

</table>

</div>
</div>

</body>
</html>
